name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # One group per PR, so a newer push supersedes its run. One group per commit on main, so no main run is ever
  # cancelled, running or waiting.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # macOS: the app links AppKit, and the hook and scripts rely on /usr/bin/jq, plutil and launchctl's CLI shape.
    # check.sh is not run here: it needs a real notched display and Screen Recording permission.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          # PRs restore main's cache but never write one, so they can't evict it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Page tests
        # dist/index.html in headless Chromium against a fake bridge (tests/page_test.sh). Playwright is installed under
        # RUNNER_TEMP so the repo gets no package.json. tests/page_test.sh exits 2 when a dependency is missing; that
        # fails the step here, it is not a skip.
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright-core@1.58.2
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/ms-playwright"
          node "$RUNNER_TEMP/pw/node_modules/playwright-core/cli.js" install chromium-headless-shell
          # The revision directory (chromium_headless_shell-NNNN) belongs to the pinned playwright-core, so glob it.
          shells=("$PLAYWRIGHT_BROWSERS_PATH"/chromium_headless_shell-*/chrome-headless-shell-mac-*/chrome-headless-shell)
          shell="${shells[0]}"
          test -x "$shell"
          PLAYWRIGHT_CORE="$RUNNER_TEMP/pw/node_modules/playwright-core" CHROMIUM="$shell" ./tests/page_test.sh
      - name: Hook tests
        run: ./tests/hook_test.sh
      - name: Installer tests
        run: ./tests/install_test.sh
      - name: Login item tests
        run: ./tests/login_test.sh
