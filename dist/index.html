<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="vendor/avatar-core.js"></script>
<style>
  :root { --tint: 245, 245, 245; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font: 600 12px -apple-system, system-ui, sans-serif; color: #f5f5f5; cursor: default; user-select: none; }
  /* The stage keeps its place on screen whatever the window size: Rust centers every window on the notch. */
  #stage { position: absolute; top: 0; left: calc(50% - var(--stage-w) / 2); width: var(--stage-w); height: var(--stage-h);
    visibility: hidden; }
  #stage.ready { visibility: visible; }
  #panel { position: absolute; inset: 0; background: #000; will-change: clip-path; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #8b8b8b; flex: none; }
  .dot.att { background: #f5a623; box-shadow: 0 0 6px #f5a623; }
  .dot.work { background: #34d058; box-shadow: 0 0 6px #34d058; }
  /* Left ear: the avatar and the session count, placed by transform (CONTRACT.md section 10). The dot stands in for
     the avatar only when it cannot be drawn. */
  .lear { position: absolute; left: 0; top: 0; z-index: 1; opacity: 0.82; }
  .lear > * { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #avatar { width: 24px; height: 24px; overflow: visible; }
  .lear #dot, .lear.plain #avatar { display: none; }
  .lear.plain #dot { display: block; }
  #total { font-size: 12px; font-weight: 600; line-height: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #total.att { color: #f5a623; }

  .bars { position: absolute; display: flex; align-items: flex-end; gap: 2px; height: 14px; }
  .bars span { width: 3px; height: 14px; border-radius: 1.5px; background: rgb(var(--tint)); transform-origin: 50% 100%;
    transform: scaleY(0.24); transition: transform 220ms ease-out; }
  .bars.on span { animation: eq var(--d) ease-in-out infinite alternate; }
  .bars span:nth-child(1) { --d: 0.62s; --lo: 0.3; }
  .bars span:nth-child(2) { --d: 0.48s; --lo: 0.5; animation-delay: -0.2s; }
  .bars span:nth-child(3) { --d: 0.71s; --lo: 0.22; animation-delay: -0.35s; }
  .bars span:nth-child(4) { --d: 0.55s; --lo: 0.4; animation-delay: -0.1s; }
  @keyframes eq { from { transform: scaleY(var(--lo)); } to { transform: scaleY(1); } }
  @media (prefers-reduced-motion: reduce) { .bars.on span { animation: none; transform: scaleY(0.6); } }

  /* Right ear: the last 60 pt of the pill. */
  #earBars { left: calc(var(--ear-r) + 33px); top: calc((var(--pill-h) - 14px) / 2); opacity: 0; }
  #panel.video #earBars { left: calc(var(--ear-r) + 37px); }
  #earPause { position: absolute; left: calc(var(--ear-r) + 35px); top: calc((var(--pill-h) - 12px) / 2); color: #8b8b8b;
    opacity: 0; }
  #panel.video #earPause { left: calc(var(--ear-r) + 39px); }

  /* One artwork for the ear, the banner and the card, moved by transform. */
  #art { position: absolute; left: 0; top: 0; width: 64px; height: 64px; border-radius: 13px; overflow: hidden;
    transform-origin: 0 0; background: #161616; opacity: 0; }
  #panel.video #art { width: 112px; height: 63px; border-radius: 8px; }
  #art .layer { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; }
  #art::after { content: ""; position: absolute; inset: 0; border-radius: inherit;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.09); pointer-events: none; }
  .ph { position: absolute; inset: 0; }
  #art.has .ph { display: none; }
  .ph::after { content: ""; position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px;
    border-radius: 50%; box-shadow: inset 0 0 0 2px #2c2c2c; }
  .ph::before { content: ""; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px;
    border-radius: 50%; background: #2c2c2c; }

  /* Expanded: the music block and the session section, positioned from the open panel's top-left. */
  #content { position: absolute; left: var(--content-l); top: 0; width: var(--open-w); height: var(--open-h); opacity: 0;
    transform: translateY(4px); pointer-events: none; }
  #music { position: absolute; inset: 0; }
  #glow { display: none; position: absolute; left: -110px; top: 34px; width: 340px; height: 200px;
    background: radial-gradient(170px 125px at 158px 42px, rgba(var(--tint), 0.34), rgba(var(--tint), 0.08) 60%, transparent);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 30px); mask-image: linear-gradient(to bottom, transparent 0, #000 30px); }
  #panel.video #glow { background: radial-gradient(170px 125px at 182px 41.5px, rgba(var(--tint), 0.34), rgba(var(--tint), 0.08) 60%, transparent); }
  #music.lit #glow { display: block; }
  .meta { position: absolute; left: 92px; top: 46px; width: 262px; }
  #panel.video .meta { left: 142px; width: 232px; }
  .title { font-weight: 600; font-size: 14px; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    letter-spacing: -0.01em; }
  #panel.video #content .title { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    font-size: 13.5px; line-height: 17px; }
  .artist { font-weight: 500; font-size: 12px; line-height: 16px; color: rgba(245, 245, 245, 0.62); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .meta.empty .artist { white-space: normal; line-height: 15px; }
  .source { margin-top: 5px; font-weight: 500; font-size: 11px; line-height: 14px; color: #8b8b8b; display: flex;
    align-items: center; gap: 5px; }
  .source i { width: 5px; height: 5px; border-radius: 50%; background: rgb(var(--tint)); flex: none; }
  #cardSource { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta.empty .source { display: none; }
  #cardBars { display: none; left: 384px; top: 50px; }
  #cardBars.on { display: flex; }
  .scrub { display: none; position: absolute; left: 16px; top: 116px; width: 388px; height: 16px; grid-template-columns: 46px 1fr 46px;
    align-items: center; gap: 6px; font-weight: 500; font-size: 11px; line-height: 1; color: #8b8b8b; font-variant-numeric: tabular-nums; }
  #music.has .scrub { display: grid; }
  #tRem { text-align: right; }
  #bar { position: relative; height: 16px; touch-action: none; }
  .line { position: absolute; left: 0; right: 0; top: 6px; height: 4px; border-radius: 2px; overflow: hidden;
    background: rgba(245, 245, 245, 0.16); }
  #bar.drag .line { transform: scaleY(1.5); }
  #fill { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: color-mix(in srgb, rgb(var(--tint)) 55%, #fff);
    transform-origin: 0 50%; transform: scaleX(0); }
  #knob { display: none; position: absolute; top: 3px; left: 0; width: 10px; height: 10px; margin-left: -5px;
    border-radius: 50%; background: #fff; }
  #bar.drag #knob { display: block; }
  .controls { position: absolute; left: 0; top: 142px; width: 420px; height: 40px; display: flex; align-items: center;
    justify-content: center; gap: 18px; }
  .cb { width: 34px; height: 34px; border: 0; padding: 0; border-radius: 50%; background: transparent; color: #f5f5f5;
    display: grid; place-items: center; opacity: 0.86; cursor: default; }
  .cb.main { width: 40px; height: 40px; background: #f5f5f5; color: #000; opacity: 1; }
  .cb:disabled { opacity: 0.3; }
  .cb.main:disabled { background: #2a2a2a; color: #777; opacity: 1; }
  .cb .i-play, .cb.paused .i-pause { display: none; }
  .cb.paused .i-play { display: block; }
  .cb:active:not(:disabled) { transform: scale(0.92); }
  .sess { position: absolute; left: 16px; top: 196px; width: 388px; }
  .sess-h { display: flex; justify-content: space-between; height: 18px; font-weight: 600; font-size: 11px; line-height: 18px; color: #8b8b8b; }
  .sess-h .att { color: #f5a623; }
  #rows { margin-top: 4px; }
  .srow { height: 22px; display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 12px; line-height: 22px; }
  .srow .p { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srow .st { flex: none; max-width: 170px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #8b8b8b; }
  .srow .st.att { color: #f5a623; }
  .srow.more { color: #8b8b8b; }
  button.srow { width: calc(100% + 12px); margin: 0 -6px; padding: 0 6px; border: 0; border-radius: 6px; background: transparent;
    color: inherit; font-family: inherit; text-align: left; cursor: default; }
  button.srow:active { background: rgba(245, 245, 245, 0.07); }
  /* The list and the session card share the place below the music block, and crossfade. */
  .sess { transition: opacity 120ms linear; }
  .sess.off { opacity: 0; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .sess { transition: none; } }
  .back { display: flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px 0 2px; margin-left: -2px; border: 0;
    border-radius: 5px; background: transparent; font: 600 11px/18px -apple-system, system-ui, sans-serif; color: #8b8b8b; cursor: default; }
  .back:active { color: #f5f5f5; background: rgba(245, 245, 245, 0.07); }
  #dLabel { min-width: 0; color: #f5f5f5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #dRows { margin: 4px 0 0; }
  .kv { display: grid; grid-template-columns: 78px minmax(0, 1fr); align-items: center; height: 22px; font-weight: 500;
    font-size: 12px; line-height: 22px; }
  .kv dt { color: #8b8b8b; font-size: 11.5px; }
  .kv dd { margin: 0; min-width: 0; display: flex; align-items: center; gap: 7px; white-space: nowrap; overflow: hidden; }
  .kv dd span:not(.dot) { overflow: hidden; text-overflow: ellipsis; }
  .kv dd .att { color: #f5a623; }
  .kv dd .age { flex: none; color: #8b8b8b; font-variant-numeric: tabular-nums; }
  #dEnded { height: 88px; margin-top: 4px; display: grid; align-content: center; font-weight: 500; font-size: 12px; line-height: 17px;
    color: #8b8b8b; }
  #dEnded[hidden] { display: none; }
  /* The prompt box (CONTRACT.md section 11). */
  .pbox { margin-top: 10px; height: 34px; display: flex; align-items: center; gap: 6px; padding: 0 4px 0 11px; border-radius: 10px;
    background: #141414; box-shadow: inset 0 0 0 1px rgba(245, 245, 245, 0.1); transition: box-shadow 120ms linear; cursor: text; }
  .pbox.typing { box-shadow: inset 0 0 0 1px rgba(245, 245, 245, 0.34); }
  .pbox[hidden], .phint[hidden] { display: none; }
  #msg { flex: 1; min-width: 0; height: 18px; padding: 0; border: 0; background: transparent; resize: none; outline: none;
    font: 500 12.5px/18px -apple-system, system-ui, sans-serif; color: #f5f5f5; white-space: pre; overflow: hidden; user-select: text; cursor: text; }
  #msg::placeholder { color: #8b8b8b; }
  #msg:disabled::placeholder { color: #6f6f6f; }
  .pbox.off, .pbox.off #msg { cursor: default; }
  .send { flex: none; width: 26px; height: 26px; border: 0; padding: 0; border-radius: 50%; background: #f5f5f5; color: #000;
    display: grid; place-items: center; cursor: default; }
  .send:disabled { background: #2a2a2a; color: #6f6f6f; }
  .send:not(:disabled):active { transform: scale(0.92); }
  .openapp { display: block; width: 100%; height: 34px; margin-top: 10px; padding: 0 12px; border: 0; border-radius: 10px; background: #1c1c1c;
    font: 600 12.5px/34px -apple-system, system-ui, sans-serif; color: #f5f5f5; text-align: center; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; cursor: default; }
  .openapp:hover { background: #262626; }
  .openapp:active { transform: scale(0.99); }
  .openapp[hidden] { display: none; }
  .phint { height: 14px; margin-top: 6px; font: 500 11px/14px -apple-system, system-ui, sans-serif; color: #8b8b8b; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .phint.ok { color: #f5f5f5; }
  .phint.att { color: #f5a623; }
  @media (prefers-reduced-motion: reduce) { .pbox { transition: none; } }

  /* A short look at what changed, shown under the notch while the panel is closed. */
  #banner { position: absolute; inset: 0; opacity: 0; transform: translateY(4px); pointer-events: none; }
  #bIcon { position: absolute; left: calc(var(--banner-l) + 16px); top: calc(var(--pill-h) + 4px); width: 34px; height: 34px;
    border-radius: 9px; background: #171717; display: grid; place-items: center; opacity: 0; }
  #bIcon .dot { width: 10px; height: 10px; }
  #bText { position: absolute; left: calc(var(--banner-l) + 62px); top: calc(var(--pill-h) + 5px); width: 262px; }
  #panel.video #bText { left: calc(var(--banner-l) + 88px); width: 246px; }
  #bTitle { font: 600 13px/17px -apple-system, system-ui, sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bSub { margin-top: 1px; font: 500 11.5px/15px -apple-system, system-ui, sans-serif; color: rgba(245, 245, 245, 0.62);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bannerBars { left: calc(var(--banner-l) + 344px); top: calc(var(--pill-h) + 14px); opacity: 0; }
</style>
</head>
<body data-phase="collapsed">
  <div id="stage">
    <div id="panel">
      <div id="content">
        <div id="music">
          <div id="glow"></div>
          <div class="meta" id="meta">
            <div class="title" id="cardTitle"></div>
            <div class="artist" id="cardArtist"></div>
            <div class="source"><i></i><span id="cardSource"></span></div>
          </div>
          <div class="bars" id="cardBars"><span></span><span></span><span></span><span></span></div>
          <div class="scrub"><span id="tEl"></span><div id="bar"><div class="line"><div id="fill"></div></div><div id="knob"></div></div><span id="tRem"></span></div>
          <div class="controls">
            <button type="button" class="cb" id="btnPrev" aria-label="Previous track"><svg viewBox="0 0 16 16" width="16" height="16"><rect x="2" y="3" width="2" height="10" rx=".8" fill="currentColor"/><path d="M13.4 3.3v9.4c0 .45-.5.72-.88.47L5.3 8.47a.56.56 0 0 1 0-.94l7.22-4.7c.38-.25.88.02.88.47z" fill="currentColor"/></svg></button>
            <button type="button" class="cb main" id="btnMain" aria-label="Pause"><svg class="i-pause" viewBox="0 0 16 16" width="16" height="16"><rect x="3.6" y="2.8" width="3" height="10.4" rx="1" fill="currentColor"/><rect x="9.4" y="2.8" width="3" height="10.4" rx="1" fill="currentColor"/></svg><svg class="i-play" viewBox="0 0 16 16" width="16" height="16"><path d="M4.4 2.9v10.2c0 .5.55.8.97.53l7.85-5.1a.62.62 0 0 0 0-1.06L5.37 2.37c-.42-.27-.97.03-.97.53z" fill="currentColor"/></svg></button>
            <button type="button" class="cb" id="btnNext" aria-label="Next track"><svg viewBox="0 0 16 16" width="16" height="16"><path d="M2.6 3.3v9.4c0 .45.5.72.88.47l7.22-4.7a.56.56 0 0 0 0-.94L3.48 2.83c-.38-.25-.88.02-.88.47z" fill="currentColor"/><rect x="12" y="3" width="2" height="10" rx=".8" fill="currentColor"/></svg></button>
          </div>
        </div>
        <div class="sess" id="sess">
          <div class="sess-h"><span>Claude Code</span><span id="sessHead"></span></div>
          <div id="rows"></div>
        </div>
        <div class="sess off" id="detail" aria-live="polite">
          <div class="sess-h"><button type="button" class="back" id="back" aria-label="Back to all sessions"><svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M6.4 1.6 3 5l3.4 3.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Claude Code</button><span id="dLabel"></span></div>
          <dl id="dRows"></dl>
          <div id="dEnded" hidden>Session ended</div>
          <div class="pbox" id="pbox">
            <textarea id="msg" rows="1" maxlength="8000" aria-label="Message to this session"></textarea>
            <button type="button" class="send" id="send" aria-label="Send" disabled><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M6 10V2.4M2.7 5.4 6 2.1l3.3 3.3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </div>
          <button type="button" class="openapp" id="openApp" hidden></button>
          <div class="phint" id="phint"></div>
        </div>
      </div>
      <div id="banner">
        <div id="bIcon"><span class="dot"></span></div>
        <div id="bText"><div id="bTitle"></div><div id="bSub"></div></div>
        <div class="bars" id="bannerBars"><span></span><span></span><span></span><span></span></div>
      </div>
      <div class="lear" id="lear"><svg id="avatar" viewBox="-150 -150 300 300" aria-hidden="true"></svg><span class="dot" id="dot"></span><span id="total">0</span></div>
      <div class="bars" id="earBars"><span></span><span></span><span></span><span></span></div>
      <svg id="earPause" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><rect x="2.5" y="1.5" width="2.4" height="9" rx=".9" fill="currentColor"/><rect x="7.1" y="1.5" width="2.4" height="9" rx=".9" fill="currentColor"/></svg>
      <div id="art"><div class="ph"></div><div class="layer"></div><div class="layer"></div></div>
    </div>
  </div>
<script>
  const STATUS_TEXT = {
    needs_input: () => 'needs your input',
    error: () => 'error',
    working: () => 'working',
    done: () => 'done',
    waiting: () => 'waiting for you',
    needs_permission: (detail) => detail ? 'needs permission: ' + detail : 'needs permission',
  };
  const $ = (id) => document.getElementById(id);
  const flush = (el) => void el.getBoundingClientRect();
  const stage = $('stage'), panel = $('panel'), content = $('content'), banner = $('banner'), artEl = $('art');
  const artLayers = [...artEl.querySelectorAll('.layer')];

  // ---- motion (CONTRACT.md section 8, ported from the approved prototype) ----
  const SPRING = (() => {
    const k = 380, c = 32, m = 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m)), wd = w0 * Math.sqrt(1 - z * z), a = z * w0;
    const x = (t) => 1 - Math.exp(-a * t) * (Math.cos(wd * t) + (a / wd) * Math.sin(wd * t));
    const D = Math.log(Math.sqrt(1 + (a / wd) ** 2) / 0.005) / a, pts = [];
    for (let i = 0; i < 40; i++) pts.push(i === 39 ? 1 : +x((i / 39) * D).toFixed(4));
    return { ms: Math.round(D * 1000), css: `linear(${pts.join(', ')})` };
  })();
  const EASE = { peek: 'cubic-bezier(0.2, 0, 0, 1)', collapse: 'cubic-bezier(0.4, 0, 1, 1)' };
  const RADIUS = { pill: 14, peek: 14, banner: 20, open: 22, detail: 22 };
  const reducedQuery = matchMedia('(prefers-reduced-motion: reduce)');
  let reduced = reducedQuery.matches;
  let L = null; // the Layout from Rust

  // media: the latest the app sent. shown: what the card draws, which is media plus any optimistic change.
  let media = null;
  let shown = null;
  let drag = null; // fraction 0..1 while the bar is being dragged
  // The optimistic change awaiting the app's confirmation: { id, kind: 'toggle' | 'seek' } or null.
  let pending = null;
  let pendingSeq = 0;
  let pendingTimer = null;
  let wide = false;

  function applyVars() {
    const s = stage.style, pillL = (L.stage.width - L.pill.width) / 2;
    s.setProperty('--stage-w', L.stage.width + 'px');
    s.setProperty('--stage-h', L.stage.height + 'px');
    s.setProperty('--pill-h', L.pill.height + 'px');
    s.setProperty('--pill-l', pillL + 'px');
    s.setProperty('--ear-r', pillL + L.pill.width - L.ear + 'px');
    s.setProperty('--banner-l', (L.stage.width - L.banner.width) / 2 + 'px');
    s.setProperty('--content-l', (L.stage.width - L.open.width) / 2 + 'px');
    s.setProperty('--open-w', L.open.width + 'px');
    s.setProperty('--open-h', L.open.height + 'px');
  }

  // ---- shape, layers, art ----
  let shapeAt = 'pill';
  function clipCSS(name) {
    const r = L[name], side = (L.stage.width - r.width) / 2, bottom = L.stage.height - r.height, rad = RADIUS[name];
    return `inset(0px ${side}px ${bottom}px ${side}px round 0px 0px ${rad}px ${rad}px)`;
  }
  function clip(name, dur = 0, ease = 'linear') {
    shapeAt = name;
    const d = reduced ? 0 : dur;
    panel.style.transition = d ? `clip-path ${d}ms ${ease}` : 'none';
    panel.style.clipPath = clipCSS(name);
    if (!d) { flush(panel); settleWindow(); }
  }
  function layerIn(el) {
    el.style.pointerEvents = 'auto';
    if (reduced) { el.style.transition = 'opacity 120ms linear'; el.style.opacity = 1; el.style.transform = 'none'; return; }
    el.style.transition = 'opacity 140ms ease-out 80ms, transform 140ms ease-out 80ms';
    el.style.opacity = 1;
    el.style.transform = 'translateY(0)';
  }
  function layerOut(el) {
    el.style.pointerEvents = 'none';
    el.style.transition = `opacity ${reduced ? 120 : 80}ms linear`;
    el.style.opacity = 0;
  }
  function layerRest(el) {
    el.style.transition = 'none';
    el.style.opacity = 0;
    el.style.transform = reduced ? 'none' : 'translateY(4px)';
    el.style.pointerEvents = 'none';
  }
  function earsBright(on) {
    const el = $('lear');
    el.style.transition = `opacity 120ms ${reduced ? 'linear' : EASE.peek}`;
    el.style.opacity = on ? 1 : 0.82;
  }

  let artWhere = 'ear';
  let artTimer = null; // the reduced-motion art fade, between its out and in halves

    st.textContent = STATUS_TEXT[row.status](row.detail);
    line.append(dot, label, st);
    return line;
  }
  function mutedRow(text) {
    const line = document.createElement('div');
    line.className = 'srow more';
    line.textContent = text;
    return line;
  }
  function render(s) {
    $('dot').className = 'dot' + (s.attention > 0 ? ' att' : s.working > 0 ? ' work' : '');
    $('total').className = s.attention > 0 ? 'att' : '';
    $('total').textContent = s.total;
    const head = $('sessHead');
    head.className = s.attention > 0 ? 'att' : '';
    head.textContent = s.attention > 0 ? s.attention + (s.attention === 1 ? ' needs you' : ' need you')
      : s.working > 0 ? s.working + ' working' : 'All quiet';
    const rows = s.rows.map(sessionRow);
    if (s.total > s.rows.length) rows.push(mutedRow(s.total - s.rows.length + ' more'));
    if (s.total === 0) rows.push(mutedRow('No Claude Code sessions'));
    $('rows').replaceChildren(...rows);
  }
  const BANNER_STATUS = new Set(['needs_permission', 'needs_input', 'error', 'done']);
  let lastRows = null; // label -> status from the previous payload; null before the first
  function onSessions(s) {
    render(s);
    refreshDetail();
    const prev = lastRows;
    lastRows = new Map(s.rows.map((r) => [r.label, r.status]));
    if (!prev) return;
    const changed = s.rows.find((r) => BANNER_STATUS.has(r.status) && prev.has(r.label) && prev.get(r.label) !== r.status);
    if (changed) showBanner('session', changed);
  }

  // ---- session card (CONTRACT.md section 4, "Detail card") ----
  let detailId = null; // the session the card shows, or null while the list shows
  let detailSeq = 0; // bumped by every request, back and reset: only the reply to the latest request is drawn
  let detailShown = null; // the Detail drawn, or null once the session ended
  let openingId = null; // the row clicked whose first reply has not come yet
  let ageTimer = null;
  const openShape = () => detailId ? 'detail' : 'open';
  const EVENT_TEXT = {
    SessionStart: () => 'Started',
    UserPromptSubmit: () => 'Got a prompt',
    PreToolUse: (t) => 'Running ' + t,
    PostToolUse: (t) => t + ' finished',
    PostToolUseFailure: (t) => t + ' failed',
    PermissionRequest: (t) => 'Asked to use ' + t,
    PermissionDenied: () => 'Permission denied',
    Notification: () => 'Waiting for your answer',
    Stop: () => 'Finished its turn',
    StopFailure: () => 'Stopped with an error',
  };
  const eventText = (d) => Object.hasOwn(EVENT_TEXT, d.event) ? EVENT_TEXT[d.event](d.tool_name || 'a tool') : d.event;
  function ago(ts) {
    const s = Math.max(0, Math.floor(Date.now() / 1000 - ts));
    return s < 60 ? s + ' s ago' : s < 3600 ? Math.floor(s / 60) + ' min ago' : Math.floor(s / 3600) + ' h ago';
  }
  const homeTilde = (cwd) => cwd.replace(/^\/Users\/(?!Shared(?:\/|$))[^/]+(?=\/|$)/, '~');
  function span(text, cls) {
    const el = document.createElement('span');
    if (cls) el.className = cls;
    el.textContent = text;
    return el;
  }
  function kv(name, ...values) {
    const row = document.createElement('div'), dt = document.createElement('dt'), dd = document.createElement('dd');
    row.className = 'kv';
    dt.textContent = name;
    dd.append(...values);
    row.append(dt, dd);
    return row;
  }
  function drawDetail(d) {
    const held = holding();
    detailShown = d;
    if (hostResult && !showsHost(hostResult)) hostResult = null;
    $('dRows').hidden = !d;
    $('dEnded').hidden = !!d;
    if (!canSend()) stopTyping();
    if (d) {
      $('dLabel').textContent = d.label;
      const folder = span(homeTilde(d.cwd));
      folder.title = d.cwd;
      $('dRows').replaceChildren(
        kv('Status', span('', 'dot' + dotClass(d.status)), span(STATUS_TEXT[d.status](null), ATTENTION.has(d.status) ? 'att' : '')),
        kv('Folder', folder),
        kv('Last event', span(eventText(d)), span(ago(d.event_ts), 'age')),
        kv('Subagents', span(d.agents ? d.agents + ' running' : 'None')));
    }
    checkPickup();
    syncPrompt();
    syncAge();
    if (held && !holding() && phase === 'expanded' && !hovered) onLeave();
  }
  function drawAge() {
    const age = $('dRows').querySelector('.age');
    if (age && detailShown) age.textContent = ago(detailShown.event_ts);
  }
  function syncAge() {
    const want = phase === 'expanded' && detailId !== null && detailShown !== null;
    if (want && ageTimer === null) ageTimer = setInterval(drawAge, 1000);
    if (!want && ageTimer !== null) { clearInterval(ageTimer); ageTimer = null; }
  }
  // Swaps the list and the card; while expanded the shape springs to the other one and the hit rect follows.
  function showCard(on, instant) {
    const sess = $('sess'), card = $('detail');
    if (instant) { sess.style.transition = card.style.transition = 'none'; }
    sess.classList.toggle('off', on);
    card.classList.toggle('off', !on);
    if (instant) { flush(card); sess.style.transition = card.style.transition = ''; }
    if (phase === 'expanded' && L) { clip(openShape(), SPRING.ms, SPRING.css); sendSurface(); }
    syncAge();
  }
  function detailRequest(id) {
    const seq = ++detailSeq;
    return window.__TAURI__.core.invoke('session_detail', { id })
      .then((d) => seq === detailSeq ? { d: d || null } : null, () => null);
  }
  function openDetail(id) {
    openingId = id;
    detailRequest(id).then((r) => {
      if (!r) return;
      openingId = null;
      if (!r.d) return;
      detailId = id;
      drawDetail(r.d);
      showCard(true);
    });
  }
  // An event while a card is opening asks again, so the card never opens on records older than the event.
  function refreshDetail() {
    if (detailId === null) {
      if (openingId !== null) openDetail(openingId);
      return;
    }
    const id = detailId;
    detailRequest(id).then((r) => { if (r && detailId === id) drawDetail(r.d); });
  }
  function closeCard(instant) {
    detailSeq++;
    openingId = null;
    stopTyping();
    hostCall = hostResult = null;
    setDelivery(null);
    clearDraft();
    if (detailId === null) return;
    detailId = null;
    detailShown = null;
    showCard(false, instant);
  }
  $('rows').addEventListener('click', (e) => {
    const row = e.target.closest('button.srow');
    if (row) openDetail(row.dataset.id);
  });
  $('back').addEventListener('click', () => closeCard(false));

  // ---- prompt box (CONTRACT.md section 11, and its "Sending" amendment) ----
  // typing: the box has the keyboard, a substate of `expanded` (section 8) in which hover-out does not collapse.
  let typing = false;
  let focusing = 0; // focus(true) calls not yet returned: a `key` false meanwhile is the previous give-back's
  let hovered = false; // the latest `hover` event
  // The last send, or null: { state, id, label, status, ts, timer, seen }, with the card's status and event_ts at the
  // send. state: sending -> sent -> picked | quiet, or sending -> failed. `seen`: the pointer was on the panel since
  // the failure.
  let delivery = null;
  // A send in flight, or a failure the pointer has not come back to, keeps the card open while the draft can still be
  // sent: collapsing would drop it.
  const holding = () => canSend() && !!delivery && (delivery.state === 'sending' || (delivery.state === 'failed' && !delivery.seen));
  const msg = $('msg');
  const draftText = () => msg.value.trim();
  const canSend = () => !!detailShown && !!detailShown.reach && detailShown.reach.kind === 'inbox';
  const TYPING_HINT = 'Return to send, Shift+Return for a new line, Esc to stop typing';
  const NO_INBOX = 'It has no inbox notch-hud can send to.';
  const DELIVERY_HINT = {
    sending: () => ['Sending\u2026', ''],
    sent: (label) => ['Sent. Waiting for ' + label + ' to pick it up.', ''],
    picked: (label) => [label + ' picked it up.', 'ok'],
    quiet: () => ['No reply yet. It may be waiting for approval in that session.', 'att'],
    failed: () => ['This session isn\'t reachable.', 'att'],
  };
  function hint() {
    if (hostOnly()) return hostResult ? [hostResult.text, hostResult.tone] : ['It has no inbox, so notch-hud can only bring ' + appName() + ' forward.', ''];
    if (detailShown && !canSend()) return [NO_INBOX, ''];
    if (delivery) return DELIVERY_HINT[delivery.state](delivery.label);
    return [typing ? TYPING_HINT : '', ''];
  }
  function syncPrompt() {
    const open = canSend();
    $('pbox').hidden = !detailShown || hostOnly();
    $('phint').hidden = !detailShown;
    $('openApp').hidden = !hostOnly();
    if (hostOnly()) $('openApp').textContent = 'Open ' + appName();
    msg.disabled = !open;
    if (detailShown) msg.placeholder = open ? 'Message ' + detailShown.label : 'This session can\'t take messages';
    $('send').disabled = !open || !draftText() || (!!delivery && delivery.state === 'sending');
    $('pbox').classList.toggle('typing', typing);
    $('pbox').classList.toggle('off', !open);
    const [text, tone] = hint();
    $('phint').textContent = text;
    $('phint').className = 'phint' + (tone ? ' ' + tone : '');
  }
  // ---- the session's app (CONTRACT.md section 11, "Opening the session's app") ----
  // hostCall: the open_host call in flight, { id, host, app }. hostResult: its reply's hint, { id, host, text, tone },
  // kept while the card shows that session with that host.
  let hostCall = null;
  let hostResult = null;
  const hostOnly = () => !!detailShown && !!detailShown.reach && detailShown.reach.kind === 'host_only';
  const appName = () => (typeof detailShown.app === 'string' && detailShown.app) || detailShown.reach.host;
  const showsHost = (h) => hostOnly() && detailShown.id === h.id && detailShown.reach.host === h.host;
  function openHost() {
    if (!hostOnly() || hostCall) return;
    const call = { id: detailShown.id, host: detailShown.reach.host, app: appName() };
    hostCall = call;
    const done = (text, tone) => {
      if (hostCall !== call) return;
      hostCall = null;
      if (!showsHost(call)) return;
      hostResult = { id: call.id, host: call.host, text, tone };
      syncPrompt();
    };
    window.__TAURI__.core.invoke('open_host', { id: call.id }).then((r) => {
      if (r && r.kind === 'opened' && typeof r.name === 'string') done('Brought ' + r.name + ' forward.', 'ok');
      else if (r && r.kind === 'not_running') done(call.app + ' isn\'t running.', 'att');
      else done('Couldn\'t bring ' + call.app + ' forward.', 'att');
    }, () => done('Couldn\'t bring ' + call.app + ' forward.', 'att'));
  }
  // The button never takes the keyboard: the press keeps DOM focus where it is and nothing calls `focus`.
  $('openApp').addEventListener('pointerdown', (e) => e.preventDefault());
  $('openApp').addEventListener('click', openHost);
  function clearDraft() {
    msg.value = '';
    syncPrompt();
  }
  function setDelivery(next) {
    if (delivery) clearTimeout(delivery.timer);
    delivery = next;
    syncPrompt();
  }
  // Moves `entry` from state `from` to `to` when it is still the current send in that state; returns whether it did.
  function advance(entry, from, to) {
    if (delivery !== entry || entry.state !== from) return false;
    clearTimeout(entry.timer);
    entry.state = to;
    syncPrompt();
    return true;
  }
  // A delivered message fires UserPromptSubmit, so the session's next hook event confirms it.
  function checkPickup() {
    const d = detailShown;
    if (!delivery || !d || d.id !== delivery.id) return;
    if (d.event_ts !== delivery.ts || (d.status === 'working' && delivery.status !== 'working')) advance(delivery, 'sent', 'picked');
  }
  function startTyping() {
    if (typing || phase !== 'expanded' || !canSend()) return;
    if (delivery && delivery.state !== 'sending' && delivery.state !== 'sent') setDelivery(null);
    typing = true;
    cancelTimer();
    syncPrompt();
    focusing++;
    // A panel that did not become key gets no keys and sends no `key` false, so typing ends here.
    const done = (key) => { focusing--; if (key === true) { if (typing) msg.focus(); } else stopTyping(); };
    window.__TAURI__.core.invoke('focus', { on: true }).then(done, () => done(false));
  }
  // Gives the keyboard back; the panel then collapses as usual if the pointer is gone.
  function stopTyping() {
    if (!typing) return;
    typing = false;
    msg.blur();
    syncPrompt();
    window.__TAURI__.core.invoke('focus', { on: false }).catch(() => {});
    if (phase === 'expanded' && !hovered) onLeave();
  }
  function sendDraft() {
    const text = draftText(), d = detailShown;
    if (!text || !canSend() || (delivery && delivery.state === 'sending')) return;
    const sent = { state: 'sending', id: d.id, label: d.label, status: d.status, ts: d.event_ts, timer: null, seen: false };
    setDelivery(sent);
    stopTyping();
    window.__TAURI__.core.invoke('prompt', { id: d.id, text }).then(() => {
      // A draft typed while the send was in flight is kept.
      if (delivery === sent && draftText() === text) msg.value = '';
      if (!advance(sent, 'sending', 'sent')) return;
      sent.timer = setTimeout(() => advance(sent, 'sent', 'quiet'), 10000);
      checkPickup();
      if (phase === 'expanded' && !hovered) onLeave();
    }, () => { if (delivery === sent) sent.seen = hovered; advance(sent, 'sending', 'failed'); });
  }
  $('pbox').addEventListener('pointerdown', (e) => {
    // A press on the box outside the text area, the send button included, leaves DOM focus where it is.
    if (e.target !== msg) e.preventDefault();
    if (!e.target.closest('#send')) startTyping();
  });
  $('send').addEventListener('click', sendDraft);
  msg.addEventListener('input', syncPrompt);
  document.addEventListener('pointerdown', (e) => { if (typing && !$('pbox').contains(e.target)) stopTyping(); }, true);
  document.addEventListener('keydown', (e) => {
    // WebKit ends a composition before the keydown that commits it, so that keydown has isComposing false and code 229.
    if (!typing || e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Escape') { e.preventDefault(); stopTyping(); }
    else if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendDraft(); }
  });

  // Ends the pending change, if any, and shows the latest media the app sent.
  function settle() {
    clearTimeout(pendingTimer);
    pending = null;
    shown = media;
    renderMedia();
  }
  function agrees(m) {
    const was = shown.track;
    return pending.kind === 'toggle'
      ? m.track.playing === was.playing
      : Math.abs(elapsedMs(m.track) - elapsedMs(was)) <= 2000;
  }
  let lastSong = null;
  function onMedia(m) {
    media = m;
    const sameTrack = pending && m.track && shown.track && m.track.title === shown.track.title;
    if (!(pending && sameTrack && !agrees(m))) settle();
    const t = m.track;
    if (!t) return;
    const song = [t.title, t.artist || '', t.app].join('\n');
    const changed = lastSong !== null && song !== lastSong;
    lastSong = song;
    if (changed) showBanner('song', t);
  }
  function setPending(kind) {
    clearTimeout(pendingTimer);
    pending = { id: ++pendingSeq, kind };
    pendingTimer = setTimeout(settle, shown && shown.via === 'applescript' ? 5000 : 2000);
    return pending.id;
  }
  function patchTrack(patch) {
    if (!shown || !shown.track) return;
    shown = { ...shown, track: { ...shown.track, ...patch } };
    renderMedia();
  }
  function send(action, id) {
    window.__TAURI__.core.invoke('act', { action }).catch(() => { if (id !== undefined && pending && pending.id === id) settle(); });
  }
  function seekTo(ms) {
    const id = setPending('seek');
    patchTrack({ elapsed_ms: ms, elapsed_at_ms: Date.now() });
    send({ kind: 'seek', position_ms: ms }, id);
  }
  $('btnMain').addEventListener('click', () => {
    const t = shown && shown.track;
    if (!t) return;
    const id = setPending('toggle');
    patchTrack({ playing: !t.playing, elapsed_ms: elapsedMs(t), elapsed_at_ms: Date.now() });
    send({ kind: 'toggle' }, id);
  });
  $('btnNext').addEventListener('click', () => { if (shown && shown.track) send({ kind: 'next' }); });
  $('btnPrev').addEventListener('click', () => {
    const t = shown && shown.track;
    if (!t) return;
    if (elapsedMs(t) > 3000) seekTo(0);
    else send({ kind: 'previous' });
  });
  const bar = $('bar');
  function fracAt(e) {
    const r = bar.getBoundingClientRect();
    return r.width > 0 ? Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) : 0;
  }
  function endDrag() {
    drag = null;
    bar.classList.remove('drag');
  }
  bar.addEventListener('pointerdown', (e) => {
    const t = shown && shown.track;
    if (e.button !== 0 || !t || t.duration_ms == null || drag !== null) return;
    bar.setPointerCapture(e.pointerId);
    bar.classList.add('drag');
    drag = fracAt(e);
    tick();
  });
  bar.addEventListener('pointermove', (e) => {
    if (drag === null) return;
    drag = fracAt(e);
    tick();
  });
  bar.addEventListener('pointerup', (e) => {
    if (drag === null) return;
    const t = shown && shown.track;
    const frac = fracAt(e);
    endDrag();
    if (t && t.duration_ms != null) seekTo(Math.round(frac * t.duration_ms));
  });
  bar.addEventListener('pointercancel', () => { endDrag(); tick(); });

  reducedQuery.addEventListener('change', (e) => { reduced = e.matches; if (L) syncInstant(); renderMedia(); showPose(); });
  render({ rows: [], total: 0, attention: 0, working: 0 });
  renderMedia();
  const tauri = window.__TAURI__;
  tauri.event.listen('layout', (e) => applyLayout(e.payload));
  tauri.event.listen('hover', (e) => {
    hovered = !!e.payload;
    if (e.payload && delivery && delivery.state === 'failed') delivery.seen = true;
    if (e.payload) onEnter();
    else {
      onLeave();
      if (drag !== null) { endDrag(); tick(); }
    }
  });
  // A startup reply older than an event of its kind is ignored.
  let mediaEvent = false, sessionsEvent = false, moodEvent = false;
  if (!window.AvatarCore) avatarFail('the renderer did not load');
  tauri.event.listen('mood', (e) => { moodEvent = true; pose = e.payload; showPose(); });
  tauri.core.invoke('avatar').then(onAvatar, () => avatarFail('the avatar command failed'));
  tauri.core.invoke('mood').then((p) => { if (p && !moodEvent) { pose = p; showPose(); } });
  tauri.event.listen('sessions', (e) => { sessionsEvent = true; onSessions(e.payload); });
  tauri.event.listen('records', () => refreshDetail());
  tauri.event.listen('key', (e) => { if (e.payload === false && focusing === 0) stopTyping(); });
  tauri.event.listen('media', (e) => { mediaEvent = true; onMedia(e.payload); });
  tauri.core.invoke('layout').then((l) => { if (l && !L) applyLayout(l); });
  tauri.core.invoke('media').then((m) => { if (m && !mediaEvent) onMedia(m); });
  tauri.core.invoke('sessions').then((s) => { if (s && !sessionsEvent) onSessions(s); });
</script>
</body>
