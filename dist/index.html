<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font: 600 12px -apple-system, system-ui, sans-serif; color: #f5f5f5; cursor: default; user-select: none; }
  .pill { position: absolute; inset: 0; background: #000; border-radius: 0 0 14px 14px;
    display: flex; align-items: flex-start; justify-content: space-between; padding: 0 14px; box-sizing: border-box; }
  .ear { height: var(--h, 32px); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #34d058; box-shadow: 0 0 6px #34d058; }
  .detail { display: none; position: absolute; left: 18px; right: 18px; bottom: 16px; font-weight: 500; line-height: 1.6; }
  body.open .detail { display: block; }
  .muted { color: #8b8b8b; }
</style>
</head>
<body>
  <div class="pill">
    <div class="ear"><span class="dot"></span><span>2</span></div>
    <div class="ear">spike</div>
    <div class="detail">
      <div>lstack · bianki <span class="muted">— verifier running</span></div>
      <div>patunay <span class="muted">— waiting for permission</span></div>
      <div class="muted">mock data · hover to expand</div>
    </div>
  </div>
<script>
  document.documentElement.style.setProperty('--h', window.innerHeight + 'px');
  window.__TAURI__.event.listen('hover', (e) => document.body.classList.toggle('open', e.payload));
</script>
</body>
</html>
